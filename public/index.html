<section class="how container" id="how">
  <div class="sec-head">
    <h2>From one skill to every agent</h2>
    <p class="lead">A skill is a folder with a SKILL.md: the steps an agent follows for one job. Rucksack carries it to everyone who should have it.</p>
  </div>
  <ol class="steps3">
    <li class="cut">
      <span class="n">1</span>
      <h3>Publish a skill</h3>
      <p>Write it on the site or push a folder from the terminal. Every version is kept.</p>
      <pre class="graphite mini">---
name: estimate-writer
description: Use when writing
  a roofing estimate
---</pre>
    </li>
    <li class="cut">
      <span class="n">2</span>
      <h3>Choose who gets it</h3>
      <p>Just you, your friends, your whole company or everyone. Mark it required and no one can skip it.</p>
      <div class="tray" aria-hidden="true"><span>Only me</span><span>Friends</span><span class="on">Harbor Roofing</span><span>Everyone</span></div>
      <div class="switch-row" aria-hidden="true"><span class="sw on"></span>Required for everyone</div>
    </li>
    <li class="cut">
      <span class="n">3</span>
      <h3>Agents sign in once</h3>
      <p>Each person adds Rucksack to their agent by its address and signs in. Their skills load at the start of every session.</p>
      <pre class="graphite mini">claude mcp add --transport http \
  rucksack https://rucksackhq.com/mcp</pre>
    </li>
  </ol>
</section>

<section class="load container" id="load">
  <div class="sec-head">
    <h2>How an agent gets its skills</h2>
    <p class="lead">Nothing is copied onto anyone’s computer. The agent reads from Rucksack as it works.</p>
  </div>
  <ol class="loads">
    <li><h3>At the start of a session</h3><p>The agent gets a short list: each skill’s name and when to use it. Just one line per skill, so a long list costs little.</p></li>
    <li><h3>When a task matches</h3><p>The agent reads that skill’s full steps, and any files it points to, then follows them.</p></li>
    <li><h3>When something changes</h3><p>An edit, a new required skill or removed access shows up in each person’s next session.</p></li>
  </ol>
</section>

<section class="control container" id="control">
  <div class="sec-head">
    <h2>Access stays with the company</h2>
    <p class="lead">Admins decide what each person’s agent can use, and can take it back.</p>
  </div>
  <dl class="ledger-list">
    <div><dt>Roles</dt><dd>Owner, admin, editor and member. Admins decide who gets each skill; editors change what skills say.</dd></div>
    <div><dt>Required skills</dt><dd>Mark a skill required and every member’s agent has it, and every update, in its next session.</dd></div>
    <div><dt>Reviewed changes</dt><dd>Members suggest changes and an editor approves them. Roll back to any earlier version.</dd></div>
    <div><dt>One sign-in per app</dt><dd>Agents connect with a standard sign-in, not a shared key. See every connected app and revoke it.</dd></div>
    <div><dt>Leaving ends access</dt><dd>Skills are served when a session starts, so someone who leaves stops getting them the next time they open their agent.</dd></div>
    <div><dt>Agent permissions</dt><dd>Choose what each agent may say in team chat, or have it ask you first.</dd></div>
  </dl>
</section>
